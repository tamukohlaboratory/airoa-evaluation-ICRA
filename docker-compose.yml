services:
  policy_server:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: airoa_policy_server
    network_mode: host
    gpus: all
    environment:
      POLICY_SERVER_HOST: "0.0.0.0"
      POLICY_SERVER_PORT: ${POLICY_SERVER_PORT:-8000}
      POLICY_CHECKPOINT_DIR: /policy_checkpoint
      POLICY_DATA_HOME: /policy_assets
      HF_HOME: /policy_hf_cache
    volumes:
      - ${POLICY_CHECKPOINT_PATH:-./.docker_cache/policy_checkpoint}:/policy_checkpoint:ro
      - ${POLICY_CACHE_DIR:-./.docker_cache/policy_cache}:/policy_assets
      - ${HF_CACHE_DIR:-./.docker_cache/hf}:/policy_hf_cache
    restart: unless-stopped

  hsr_client:
    build:
      context: .
      dockerfile: client/Dockerfile
    container_name: airoa_hsr_client
    network_mode: host
    privileged: true
    gpus: all
    depends_on:
      - policy_server
    environment:
      DISPLAY: ${DISPLAY:-:0}
      QT_X11_NO_MITSHM: "1"
      TEST_MODE: ${TEST_MODE:-true}
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
      ROS_LOCALHOST_ONLY: ${ROS_LOCALHOST_ONLY:-0}
      POLICY_SERVER_HOST: ${POLICY_SERVER_HOST:-127.0.0.1}
      POLICY_SERVER_PORT: ${POLICY_SERVER_PORT:-8000}
      POLICY_SERVER_API_KEY: ${POLICY_SERVER_API_KEY:-}
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      - /dev:/dev
      - ${ROSBAG_DIR:-./datasets/rosbags}:/root/datasets/rosbags
    command: >-
      bash -lc "
      source /opt/ros/humble/setup.bash &&
      source /root/ros2_ws/install/setup.bash &&
      echo '[INFO] Client container is ready. Run ros2 launch manually:' &&
      echo 'ros2 launch hsr_policy_client hsr_policy_client.launch.py policy_server_host:=${POLICY_SERVER_HOST:-127.0.0.1} policy_server_port:=${POLICY_SERVER_PORT:-8000} policy_server_api_key:=${POLICY_SERVER_API_KEY:-} test_mode:=${TEST_MODE:-true}' &&
      sleep infinity
      "
